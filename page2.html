<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popcorn</title>
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <header class="compact">
      <h1>Popcorn</h1>
    </header>

    <nav class="controls">
      <ul>
        <li class="dropdown">
          <button>Butter</button>
          <ul class="dropdown-menu">
            <li>
              <button
                class="move-btn"
                data-image="Butter-1.png">
                Move 1
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="Butter-2.png">
                Move 2
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="Butter-3.png">
                Move 3
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="Butter-Final Attack.png">
                Final Attack
              </button>
            </li>
          </ul>
        </li>

        <li class="dropdown">
          <button>Salt</button>
          <ul class="dropdown-menu">
            <li>
              <button
                class="move-btn"
                data-image="Salt-1.png">
                Move 1
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="Salt-2.png">
                Move 2
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="https://placehold.co/500x350?text=Salt+Move+3">
                Move 3
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="Salt-Final Attack.png">
                Final Attack
              </button>
            </li>
          </ul>
        </li>

        <li class="dropdown">
          <button>Fire</button>
          <ul class="dropdown-menu">
            <li>
              <button
                class="move-btn"
                data-image="https://placehold.co/500x350?text=Fire+Move+1">
                Move 1
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="https://placehold.co/500x350?text=Fire+Move+2">
                Move 2
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="https://placehold.co/500x350?text=Fire+Move+3">
                Move 3
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="https://placehold.co/500x350?text=Fire+Move+4">
                Final Attack
              </button>
            </li>
          </ul>
        </li>

        <li class="dropdown">
          <button>Microwave</button>
          <ul class="dropdown-menu">
            <li>
              <button
                class="move-btn"
                data-image="Microwave-1.png">
                Move 1
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="Microwave-2.png">
                Move 2
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="Microwave-3.png">
                Move 3
              </button>
            </li>
            <li>
              <button
                class="move-btn"
                data-image="https://placehold.co/500x350?text=Microwave+Move+4">
                Move 4
              </button>
            </li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="game-board">
      <img id="board-image" src="" alt="" hidden />
      <p id="board-placeholder">Pick a move to see what happens!</p>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
